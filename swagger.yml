openapi: 3.0.3

info:
  title: Storybook API
  description: API for AI Personalized Storybook Platform
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local Development

tags:
  - name: Health
  - name: Templates
  - name: Orders
  - name: Payments
  - name: Admin
  - name: Characters

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health Check
      responses:
        "200":
          description: API is running

  /templates:
    get:
      tags:
        - Templates
      summary: Get all story templates
      responses:
        "200":
          description: List of templates

  /templates/{templateId}:
    get:
      tags:
        - Templates
      summary: Get template details
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Template details

  /orders:
    post:
      tags:
        - Orders
      summary: Create a new storybook order
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object

              required:
                - storyType
                - childPhoto
                - childName
                - age
                - gender
                - email
                - phone
                - addressLine1
                - city
                - state
                - pincode

              properties:
                storyType:
                  type: string
                  enum:
                    - TEMPLATE
                    - CUSTOM

                templateId:
                  type: string
                  nullable: true
                  example: tpl_001

                customStory:
                  type: string
                  format: binary
                  description: Required only for CUSTOM story type

                childPhoto:
                  type: string
                  format: binary

                childName:
                  type: string

                age:
                  type: integer

                gender:
                  type: string
                  enum:
                    - Male
                    - Female
                    - Other

                email:
                  type: string
                  format: email

                phone:
                  type: string

                addressLine1:
                  type: string

                addressLine2:
                  type: string

                city:
                  type: string

                state:
                  type: string

                pincode:
                  type: string

      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreatedResponse"

  /orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order details
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"

  /orders/{orderId}/payment:
    post:
      tags:
        - Payments
      summary: Create payment order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Razorpay order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"

  /payments/webhook:
    post:
      tags:
        - Payments
      summary: Payment webhook
      responses:
        "200":
          description: Webhook processed

  /admin/orders:
    get:
      tags:
        - Admin
      summary: Get all orders
      responses:
        "200":
          description: Orders fetched successfully

  /admin/orders/{orderId}:
    get:
      tags:
        - Admin
      summary: Get order details
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details

  /admin/orders/{orderId}/status:
    patch:
      tags:
        - Admin
      summary: Update order status
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - status

              properties:
                status:
                  type: string
                  enum:
                    - PENDING
                    - PAYMENT_PENDING
                    - PAID
                    - GENERATING_STORY
                    - GENERATING_IMAGES
                    - QUALITY_CHECK
                    - PDF_GENERATED
                    - PRINTING
                    - SHIPPED
                    - DELIVERED
                    - CANCELLED

      responses:
        "200":
          description: Status updated

  /protected/character:
    post:
      tags:
        - Characters
      summary: Create a character with an uploaded image
      description: Uploads the image to S3 and stores the returned S3 object key in character_images.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "201":
          description: Character created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterCreatedResponse"
        "400":
          description: Invalid request or missing image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "500":
          description: Character creation or S3 upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /protected/character/{id}:
    get:
      tags:
        - Characters
      summary: Get character details and images
      parameters:
        - name: id
          in: path
          required: true
          description: Character UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Character fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterResponse"
        "404":
          description: Character not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "500":
          description: Character fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean

        message:
          type: string

        data:
          type: object
          nullable: true

        meta:
          type: object
          nullable: true

    OrderCreatedResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                orderId:
                  type: string
                  example: ord_123456

    OrderResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                orderId:
                  type: string

                status:
                  type: string

                estimatedDelivery:
                  type: string
                  format: date

                paymentStatus:
                  type: string

                trackingNumber:
                  type: string
                  nullable: true

    PaymentResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                paymentProvider:
                  type: string
                  example: razorpay

                orderId:
                  type: string

                amount:
                  type: number

                currency:
                  type: string

                paymentUrl:
                  type: string

    CreateCharacterRequest:
      type: object
      required:
        - orderId
        - name
        - gender
        - age
        - hobbies
        - storyRole
        - customMessage
        - image
      properties:
        orderId:
          type: string
          example: order-103
        name:
          type: string
          example: Rahul
        gender:
          type: string
          example: male
        age:
          type: integer
          minimum: 0
          example: 10
        hobbies:
          type: string
          example: football,reading
        storyRole:
          type: string
          example: hero
        customMessage:
          type: string
          example: Great job Rahul!
        image:
          type: string
          format: binary
          description: Image file uploaded to S3 by the API.

    CharacterCreatedResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CharacterText"

    CharacterResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/CharacterDetails"

    CharacterText:
      type: object
      required:
        - orderId
        - name
        - gender
        - age
        - hobbies
        - storyRole
        - customMessage
      properties:
        orderId:
          type: string
        name:
          type: string
        gender:
          type: string
        age:
          type: integer
        hobbies:
          type: string
        storyRole:
          type: string
        customMessage:
          type: string

    CharacterDetails:
      allOf:
        - $ref: "#/components/schemas/CharacterText"
        - type: object
          required:
            - id
            - createdAt
            - images
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            images:
              type: array
              items:
                $ref: "#/components/schemas/CharacterImage"

    CharacterImage:
      type: object
      required:
        - id
        - imageUrl
        - s3Key
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        imageUrl:
          type: string
          format: uri
          description: S3 URL derived from s3Key at response time.
        s3Key:
          type: string
          example: uploads/123-456-789/37efcd06-d607-45c5-acae-a8a1608672bb.png
          description: S3 object key persisted in character_images.
        createdAt:
          type: string
          format: date-time
